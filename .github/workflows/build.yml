name: Build and Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version Bump Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Remove problematic native dependencies
        run: |
          if (Test-Path node_modules/canvas) {
            Remove-Item -Recurse -Force node_modules/canvas
          }
        shell: pwsh

      - name: Version Bump and Commit
        id: bump_version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $bumpType = "${{ github.event.inputs.bump }}"
          } else {
            $bumpType = "patch"
          }

          if ($bumpType -ne "none") {
            # Only run the bump script, not the full dist (to save time)
            node scripts/bump-version.js "--$bumpType"
            $version = node -p "require('./package.json').version"
            echo "NEW_VERSION=v$version" >> $env:GITHUB_OUTPUT
            
            git add package.json README.md
            git commit -m "chore: bump version to v$version [skip ci]"
            git tag "v$version"
            
            # Push to the current branch dynamically
            $branch = "${{ github.ref_name }}"
            git push origin $branch --tags
          } else {
            echo "NEW_VERSION=none" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Package
        # Build the app once here
        run: |
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presentorbord-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: steps.bump_version.outputs.NEW_VERSION != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.NEW_VERSION }}
          name: Release ${{ steps.bump_version.outputs.NEW_VERSION }}
          body: "Automatic build for version ${{ steps.bump_version.outputs.NEW_VERSION }}"
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
