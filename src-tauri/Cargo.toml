[package]
name = "presentorbord"
version = "6.2.17"
description = "Educational Whiteboard App"
authors = ["Antigravity"]
license = "MIT"
edition = "2021"

[lib]
name = "presentorbord_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
